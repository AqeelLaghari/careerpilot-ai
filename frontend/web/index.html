<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CareerPilot AI: your 24/7 AI career counselor. ATS resume check, career roadmap, remote jobs and live AI mock interviews.">
  <meta name="theme-color" content="#011A42">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CareerPilot AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (the logo on navy) -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CareerPilot AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start screen: shown instantly while the app downloads, removed when Flutter draws its
       first frame. Looks the same as BrandLoading in lib/widgets/brand.dart. -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #cp-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    #cp-splash.cp-hide { opacity: 0; pointer-events: none; }
    #cp-splash img {
      width: min(340px, 70vw); height: auto;
      animation: cp-in 0.6s ease both;
    }
    #cp-splash .cp-bar {
      width: min(187px, 38vw); height: 4px; margin-top: 28px;
      border-radius: 4px; overflow: hidden; background: rgba(1, 26, 66, 0.1);
    }
    #cp-splash .cp-bar::after {
      content: ""; display: block; height: 100%; width: 40%;
      border-radius: 4px; background: #011A42;
      animation: cp-slide 1.2s ease-in-out infinite;
    }
    #cp-splash p { margin-top: 18px; color: #6b7280; font-size: 13px; animation: cp-in 0.6s 0.2s ease both; }
    @keyframes cp-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes cp-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #cp-splash img, #cp-splash p { animation: none; }
      #cp-splash .cp-bar::after { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="cp-splash" role="status" aria-label="Loading CareerPilot AI">
    <img src="splash/logo_horizontal.png" alt="CareerPilot AI">
    <div class="cp-bar"></div>
    <p>Your 24/7 AI career counselor</p>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("cp-splash");
      if (!s) return;
      s.classList.add("cp-hide");
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>

  <!-- Camera + face tracking for the live interview (runs only in the browser) -->
  <script src="face_tracker.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
