# Ruff: the Python code checker used locally (pre-commit) and in CI (GitHub Actions).
line-length = 130
target-version = "py311"

[lint]
# E/W pycodestyle, F pyflakes (real bugs: unused/undefined names), B bugbear (likely bugs), I import order
select = ["E", "F", "W", "B", "I"]
ignore = [
    "B008",   # FastAPI's Depends(...) in default arguments is the framework's standard pattern
    "E741",   # short names like `l` are fine in small loops
]

[lint.per-file-ignores]
"tests/*" = ["E501"]   # long test data lines are fine

