# Continuous deployment of the web app: on every push to main (= a merged pull request) that
# changes the frontend, the Flutter web app is built and published on Firebase Hosting (free):
#   https://careerpilot-ai-762bb.web.app
# Pull requests only build it (to catch build errors before merging).
#
# The app reads the backend address from config.json on the website (frontend/web/config.json),
# so switching servers is a one-line change (deploy/set-backend-url.ps1). The same address is built
# in as the fallback, read from that file below.
name: Web

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Build web app (+ deploy from main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - run: flutter pub get

      - name: Backend address (from frontend/web/config.json, the only place it is written)
        run: echo "API_URL=$(python3 -c "import json;print(json.load(open('web/config.json'))['api_url'])")" >> "$GITHUB_ENV"

      - name: Build
        run: |
          flutter build web --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CONFIG_URL=config.json
          du -sh build/web | awk '{print "### Web app size: " $1}' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: careerpilot-ai-762bb
          channelId: live
          entryPoint: frontend

      - name: Check the live site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://careerpilot-ai-762bb.web.app/ | grep -qi "<html"
          curl -fsS https://careerpilot-ai-762bb.web.app/config.json
          echo "### Live: https://careerpilot-ai-762bb.web.app" >> "$GITHUB_STEP_SUMMARY"
