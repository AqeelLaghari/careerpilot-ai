# Builds the backend Docker image and smoke-tests it: the container must start and answer
# /health, and the debug endpoints must not exist in production. Runs when backend files change.
#
# Continuous deployment: on a push to main (= a merged pull request) the tested image is pushed
# to GitHub Container Registry and the Azure Container App is switched to it, then the live
# /health is checked. Azure login uses OpenID Connect (no password stored anywhere): Azure trusts
# GitHub tokens for this repository's main branch only. The app's own keys (Gemini, Firebase)
# are Container App secrets on Azure and never pass through GitHub.
name: Docker

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never stop a deployment half way

env:
  IMAGE: ghcr.io/aqeellaghari/careerpilot-backend
  AZURE_APP: careerpilot-api
  AZURE_RG: careerpilot-rg

jobs:
  build:
    name: Build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true             # keep it on the runner for the smoke test
          tags: careerpilot-backend:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name api -p 7860:7860 careerpilot-backend:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:7860/health > health.json; then
              echo "Up after ${i}x2 s"; cat health.json; exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs api; exit 1

      - name: Check production settings
        run: |
          grep -q '"environment":"production"' health.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/debug/state/someone)
          echo "debug endpoint answered HTTP $code"
          test "$code" = "404"

      - name: Image size
        if: always()
        run: |
          docker image ls careerpilot-backend:ci --format '{{.Size}}' \
            | awk '{print "### Docker image size: " $1}' >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -n 60

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      packages: write        # push the image to ghcr.io
      id-token: write        # OpenID Connect login to Azure
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (same layers as the tested build, from the cache)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Switch the Container App to the new image
        run: |
          az containerapp ingress update -n "$AZURE_APP" -g "$AZURE_RG" --target-port 7860 -o none
          az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" \
            --image "$IMAGE:${{ github.sha }}" --revision-suffix "g${GITHUB_SHA::7}" -o none

      - name: Live URL
        id: url
        run: |
          fqdn=$(az containerapp show -n "$AZURE_APP" -g "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Check the live server
        run: |
          # The app sleeps when unused; the first request wakes it (image pull + model loading).
          for i in $(seq 1 60); do
            if curl -fs --max-time 20 "${{ steps.url.outputs.url }}/health" > health.json \
               && grep -q "\"commit\":\"${GITHUB_SHA}\"" health.json; then
              echo "Live after ${i} tries"; cat health.json
              echo "### Deployed: ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "The new version did not answer /health in 10 minutes"; exit 1
