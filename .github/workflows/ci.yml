# Continuous Integration: runs on every push and pull request.
# A pull request can only be merged when all three jobs are green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: read

concurrency:                  # a newer push cancels the older run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies (PyTorch CPU-only)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts --output-format github

      - name: Tests with coverage
        run: |
          pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml \
            | tee pytest-output.txt
          echo '### Backend tests' >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 pytest-output.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^TOTAL' pytest-output.txt | awk '{print "**Coverage: " $NF "**"}' >> "$GITHUB_STEP_SUMMARY" || true
        env:
          APP_ENV: test         # no .env, no Firebase key: Firestore runs in memory, Gemini is faked

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (format + analyze + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - run: flutter pub get

      - name: Format check (dart format)
        run: dart format --output none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
