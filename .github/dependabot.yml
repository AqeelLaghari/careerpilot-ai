# Dependabot: GitHub checks our libraries every week and opens a pull request when an update
# (especially a security fix) is available. CI then tests the update before anyone merges it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      flutter-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
